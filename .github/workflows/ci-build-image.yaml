name: ci-build-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/loinguyen110494/saas-demo-app
  GITOPS_REPO: loinguyen110494/saas-demo-gitops
  GITOPS_PATH: apps/saas-demo-app/overlays/tenant-a/kustomization.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repo
        working-directory: gitops
        run: |
          sed -i "s/newTag: .*/newTag: ${{ steps.vars.outputs.short_sha }}/" "${GITOPS_PATH}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${GITOPS_PATH}"
          git commit -m "Update saas-demo-app image to ${{ steps.vars.outputs.short_sha }}" || echo "No changes to commit"
          git remote set-url origin "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${GITOPS_REPO}.git"
          git push origin main
